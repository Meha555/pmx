name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Test (dynamic plugins)
        shell: bash
        run: |
          cargo build -p pmx-module-process-basic -p pmx-module-process-restart \
            -p pmx-module-handle-growth -p pmx-module-memory-growth -p pmx-module-lsof \
            -p pmx-module-pstack -p pmx-module-top -p pmx-module-json -p pmx-module-perfetto \
            --features pmx-ffi
          mkdir -p target/debug/plugins
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/debug/pmx_module_*.dll target/debug/plugins/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp target/debug/libpmx_module_*.dylib target/debug/plugins/
          else
            cp target/debug/libpmx_module_*.so target/debug/plugins/
          fi
          cargo test -p pmx --no-default-features --features dynamic --test dynamic_plugins
