[package]
name = "pmx"
version = "0.1.0"
edition = "2024"
description = "Pressure-test process monitoring and diagnostics CLI"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"
